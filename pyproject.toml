[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ymdm"
version = "0.1.0"
description = "YouTube Music Download Manager"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "mutagen",
    "click",
]

[project.optional-dependencies]
tui     = ["textual>=0.70.0"]
desktop = ["pygobject>=3.48.0"]
full    = ["textual>=0.70.0", "pygobject>=3.48.0"]

[project.scripts]
ymdm     = "ymdm.cli:main"
ymdm-gtk = "ymdm.gtk.main:run"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ymdm*"]
