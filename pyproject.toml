[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ymdm"
version = "0.1.0"
description = "YouTube Music Download Manager"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "ytmusicapi",
    "mutagen",
    "rich",
    "textual",
    "click",
]

[project.scripts]
ymdm = "ymdm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ymdm*"]
